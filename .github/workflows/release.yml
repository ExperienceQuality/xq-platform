# hub-stage: publish
# Bump package versions in a PR; merging publishes. Unchanged versions skip.
name: Release

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    uses: ExperienceQuality/.github/.github/workflows/node-build.yml@v2
    with:
      package-manager: pnpm

  test:
    uses: ExperienceQuality/.github/.github/workflows/node-test.yml@v2
    with:
      package-manager: pnpm

  publish:
    needs: [build, test]
    strategy:
      fail-fast: false
      matrix:
        package:
          [
            rest-client,
            db,
            stub,
            core,
            test,
            test-browser,
            test-infra,
          ]
    uses: ExperienceQuality/.github/.github/workflows/node-publish.yml@v2
    permissions:
      contents: read
      packages: write
    with:
      package-manager: pnpm
      working-directory: packages/${{ matrix.package }}

  # Feeds pages.yml (not part of hub contract).
  cucumber-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci:cucumber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cucumber-report-node-24
          path: artifacts/index.html
          if-no-files-found: error
          retention-days: 7
