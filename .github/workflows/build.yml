# hub-stage: build
name: Build

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ExperienceQuality/.github/.github/workflows/node-build.yml@v2
    with:
      package-manager: pnpm
