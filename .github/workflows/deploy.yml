# hub-stage: deploy
name: Node release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ref: ${{ steps.route.outputs.ref }}
      version: ${{ steps.route.outputs.version }}
    steps:
      - id: route
        name: Validate release tag
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG_NAME="$REF_NAME"
          if [[ -n "$RELEASE_TAG" ]]; then TAG_NAME="$RELEASE_TAG"; fi
          if [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ref=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release tag: $REF_NAME" >&2
            exit 1
          fi

  build:
    needs: route
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.route.outputs.ref }}

  test:
    needs: [route, build]
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.route.outputs.ref }}

  release-gate:
    needs: [route, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.route.outputs.ref }}

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Verify routed release version
        env:
          RELEASE_VERSION: ${{ needs.route.outputs.version }}
          RELEASE_TAG: ${{ needs.route.outputs.ref }}
        run: node scripts/verify-release-version.mjs --version "$RELEASE_VERSION" --tag "$RELEASE_TAG"

      - name: Install exact dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete release validation
        run: pnpm run ci:release

      - name: Upload Cucumber release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-release-report-${{ needs.route.outputs.ref }}
          path: artifacts/index.html
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: [route, build, test, release-gate]
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.route.outputs.ref }}
      release_version: ${{ needs.route.outputs.version }}
    permissions:
      contents: read
      packages: write

  release:
    needs: [route, build, test, release-gate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.route.outputs.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.route.outputs.version }}
          TAG_NAME: ${{ needs.route.outputs.ref }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "@experiencequality/test platform release ${VERSION}; published to the company GitHub Packages npm registry."
