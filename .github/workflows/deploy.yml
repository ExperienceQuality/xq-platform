# hub-stage: deploy
name: Node release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Exact release commit SHA to validate, publish, or finalize
        required: true
        type: string
      finalize_only:
        description: Verify published packages and create the platform release only
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  select-mode:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      mode: ${{ steps.mode.outputs.mode || steps.finalize.outputs.mode }}
      publish-plan-artifact-id: ${{ steps.mode.outputs.publish-plan-artifact-id }}
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - name: Resolve exact release commit
        id: ref
        run: |
          RELEASE_SHA='${{ inputs.release_sha || github.sha }}'
          if [[ ! "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "release_sha must be an exact 40-character commit SHA" >&2
            exit 1
          fi
          echo "ref=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ steps.ref.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Select release mode
        id: mode
        if: ${{ inputs.finalize_only != true }}
        uses: changesets/action/select-mode@v2
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Select manual finalization mode
        id: finalize
        if: ${{ inputs.finalize_only == true }}
        run: echo "mode=finalize" >> "$GITHUB_OUTPUT"

  version:
    if: needs.select-mode.outputs.mode == 'version'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.select-mode.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create or update Version Packages PR
        uses: changesets/action/version@v2
        with:
          github-token: ${{ github.token }}
          script: pnpm run changeset:version

  build:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: select-mode
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.select-mode.outputs.ref }}

  test:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, build]
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.select-mode.outputs.ref }}

  release-gate:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, build, test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.select-mode.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Verify aligned package versions
        run: |
          VERSION=$(node -p "require('./packages/rest-client/package.json').version")
          node scripts/verify-release-version.mjs --version "$VERSION"

      - name: Run complete release validation
        run: pnpm run ci:release

      - name: Upload Cucumber release report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-release-report-${{ needs.select-mode.outputs.ref }}
          path: artifacts/index.html
          if-no-files-found: ignore
          retention-days: 14

  publish:
    if: needs.select-mode.outputs.mode == 'publish'
    needs: [select-mode, build, test, release-gate]
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.select-mode.outputs.ref }}
      publish_plan_artifact_id: ${{ needs.select-mode.outputs.publish-plan-artifact-id }}
    permissions:
      contents: write
      packages: write

  verify-published:
    if: needs.select-mode.outputs.mode == 'finalize'
    needs: select-mode
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.select-mode.outputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://npm.pkg.github.com'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every expected package version
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/verify-published-packages.mjs

  platform-release:
    if: needs.select-mode.outputs.mode == 'finalize'
    needs: [select-mode, verify-published]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ needs.select-mode.outputs.ref }}
      - name: Resolve release version
        id: version
        run: echo "version=$(node -p "require('./packages/rest-client/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create platform release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ needs.select-mode.outputs.ref }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/create-platform-release.mjs
