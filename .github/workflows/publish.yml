# hub-stage: publish
name: Publish Node packages

on:
  workflow_call:
    inputs:
      ref:
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    uses: ExperienceQuality/.github/.github/workflows/node-publish.yml@v1
    with:
      node-version: "24"
      package-manager: pnpm
      prepare: ci:build
      ref: ${{ inputs.ref }}
      package-directories: |
        packages/rest-client
        packages/db
        packages/stub
        packages/core
        packages/test
        packages/test-browser
        packages/test-infra

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.0
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://npm.pkg.github.com"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify every expected package version
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/verify-published-packages.mjs

  platform-release:
    needs: verify-published
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.ref }}
      - name: Resolve release version
        id: version
        run: echo "version=$(node -p "require('./packages/rest-client/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Create platform release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_SHA: ${{ inputs.ref }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/create-platform-release.mjs
